name: Build & Publish GHCR Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional image tag to publish (use latest only from main)'
        required: false
        default: ''

# Grants write permission to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            image_name: api
          - service: worker
            dockerfile: docker/Dockerfile.worker
            image_name: worker
          - service: dashboard
            dockerfile: docker/Dockerfile.dashboard
            image_name: dashboard
          - service: docs
            dockerfile: docker/Dockerfile.docs
            image_name: docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Protect the latest image tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag == 'latest' && github.ref != 'refs/heads/main'
        run: |
          echo "The latest tag can only be published from the main branch." >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version || '1.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

