services:
  postgres:
    image: postgres:16-alpine
    container_name: emitmail-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-maildb}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailuser} -d ${POSTGRES_DB:-maildb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mail_net

  redis:
    image: redis:7-alpine
    container_name: emitmail-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mail_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: emitmail-api-dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
      - "${SMTP_RELAY_PORT:-25}:2525"
      - "${SMTP_SUBMISSION_PORT:-2525}:2525"
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PORT: 4000
      APP_VERSION: ${APP_VERSION:-latest}
      GITHUB_REPO: ${GITHUB_REPO:-omkarbhosale-dev/emitmail}
      UPDATER_SECRET: ${UPDATER_SECRET:-changeme}
      UPDATER_URL: http://updater:9999/trigger-update
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-maildb}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-development_only_jwt_secret_change_before_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}
      INBOUND_SMTP_ENABLED: "true"
      INBOUND_SMTP_PORT: 2525
      INBOUND_SMTP_HOST: "0.0.0.0"
      INBOUND_MAX_BYTES: ${INBOUND_MAX_BYTES:-26214400}
      MAIL_SERVER_HOSTNAME: ${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}}
      SENDING_SERVER_IP: ${SENDING_SERVER_IP:-${VPS_PUBLIC_IPV4:-0.0.0.0}}
      RETURN_PATH_SUBDOMAIN: ${RETURN_PATH_SUBDOMAIN:-send}
      SPF_INCLUDE_DOMAIN: ${SPF_INCLUDE_DOMAIN:-_spf.yourdomain.com}
      VPS_PUBLIC_IPV4: ${VPS_PUBLIC_IPV4:-0.0.0.0}
      START_WORKERS: "false"
      EMAIL_QUEUE_NAME: email-delivery-queue
      ALLOW_PENDING_DOMAIN_API_KEYS: "true"
      DIRECT_MX_FALLBACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mail_net

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: emitmail-worker-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-maildb}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      MAIL_SERVER_HOSTNAME: ${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}}
      SENDING_SERVER_IP: ${SENDING_SERVER_IP:-${VPS_PUBLIC_IPV4:-0.0.0.0}}
      RETURN_PATH_SUBDOMAIN: ${RETURN_PATH_SUBDOMAIN:-send}
      SPF_INCLUDE_DOMAIN: ${SPF_INCLUDE_DOMAIN:-_spf.yourdomain.com}
      VPS_PUBLIC_IPV4: ${VPS_PUBLIC_IPV4:-0.0.0.0}
      EMAIL_QUEUE_NAME: email-delivery-queue
      WORKER_CONCURRENCY: 5
      DIRECT_MX_FALLBACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - mail_net

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}/api/v1
    container_name: emitmail-dashboard-dev
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:4000}/api/v1
    depends_on:
      api:
        condition: service_started
    networks:
      - mail_net

  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    container_name: emitmail-docs-dev
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - HOSTNAME=0.0.0.0
    networks:
      - mail_net

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  mail_net:
    driver: bridge
