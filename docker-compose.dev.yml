services:
  emitmail-postgres:
    image: postgres:16-alpine
    container_name: emitmail-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: emitmail
      POSTGRES_PASSWORD: emitmail_pass
      POSTGRES_DB: emitmail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emitmail -d emitmail"]
      interval: 5s
      timeout: 5s
      retries: 5

  emitmail-redis:
    image: redis:7-alpine
    container_name: emitmail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
