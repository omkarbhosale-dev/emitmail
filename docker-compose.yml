services:
  postgres:
    image: postgres:16-alpine
    container_name: emitmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-maildb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailuser} -d ${POSTGRES_DB:-maildb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mail_net

  redis:
    image: redis:7-alpine
    container_name: emitmail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mail_net

  api:
    image: ghcr.io/${GITHUB_REPO:-omkarbhosale-dev/emitmail}/api:${APP_VERSION:-latest}
    container_name: emitmail-api
    restart: unless-stopped
    ports:
      # Localhost binding protects API from direct exposure behind reverse proxies
      - "127.0.0.1:${API_PORT:-4000}:4000"
      # Inbound SMTP Receiver (port 25 MX relay & port 2525 submission)
      - "0.0.0.0:${SMTP_RELAY_PORT:-25}:2525"
      - "0.0.0.0:${SMTP_SUBMISSION_PORT:-2525}:2525"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PORT: 4000
      APP_VERSION: ${APP_VERSION:-latest}
      GITHUB_REPO: ${GITHUB_REPO:-omkarbhosale-dev/emitmail}
      UPDATER_SECRET: ${UPDATER_SECRET:-changeme}
      UPDATER_URL: http://updater:9999/trigger-update
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-maildb}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-changeme}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-changeme}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}
      INBOUND_SMTP_ENABLED: "true"
      INBOUND_SMTP_PORT: 2525
      INBOUND_SMTP_HOST: "0.0.0.0"
      INBOUND_MAX_BYTES: ${INBOUND_MAX_BYTES:-26214400}
      MAIL_SERVER_HOSTNAME: ${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}}
      SENDING_SERVER_IP: ${SENDING_SERVER_IP:-${VPS_PUBLIC_IPV4:-0.0.0.0}}
      RETURN_PATH_SUBDOMAIN: ${RETURN_PATH_SUBDOMAIN:-send}
      SPF_INCLUDE_DOMAIN: ${SPF_INCLUDE_DOMAIN:-_spf.yourdomain.com}
      VPS_PUBLIC_IPV4: ${VPS_PUBLIC_IPV4:-0.0.0.0}
      START_WORKERS: "false"
      EMAIL_QUEUE_NAME: email-delivery-queue
      ALLOW_PENDING_DOMAIN_API_KEYS: "true"
      DIRECT_MX_FALLBACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mail_net

  worker:
    image: ghcr.io/${GITHUB_REPO:-omkarbhosale-dev/emitmail}/worker:${APP_VERSION:-latest}
    container_name: emitmail-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mailuser}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-maildb}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-changeme}
      MAIL_SERVER_HOSTNAME: ${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}
      SMTP_EHLO_HOSTNAME: ${SMTP_EHLO_HOSTNAME:-${MAIL_SERVER_HOSTNAME:-mail.yourdomain.com}}
      SENDING_SERVER_IP: ${SENDING_SERVER_IP:-${VPS_PUBLIC_IPV4:-0.0.0.0}}
      RETURN_PATH_SUBDOMAIN: ${RETURN_PATH_SUBDOMAIN:-send}
      SPF_INCLUDE_DOMAIN: ${SPF_INCLUDE_DOMAIN:-_spf.yourdomain.com}
      VPS_PUBLIC_IPV4: ${VPS_PUBLIC_IPV4:-0.0.0.0}
      EMAIL_QUEUE_NAME: email-delivery-queue
      WORKER_CONCURRENCY: 10
      DIRECT_MX_FALLBACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - mail_net

  dashboard:
    image: ghcr.io/${GITHUB_REPO:-omkarbhosale-dev/emitmail}/dashboard:${APP_VERSION:-latest}
    container_name: emitmail-dashboard
    restart: unless-stopped
    ports:
      # Localhost binding for secure reverse-proxy termination
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:4000}/api/v1
    depends_on:
      api:
        condition: service_started
    networks:
      - mail_net

  docs:
    image: ghcr.io/${GITHUB_REPO:-omkarbhosale-dev/emitmail}/docs:${APP_VERSION:-latest}
    container_name: emitmail-docs
    restart: unless-stopped
    ports:
      # Localhost binding for documentation portal
      - "127.0.0.1:${DOCS_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    networks:
      - mail_net

  updater:
    image: docker:27-cli
    container_name: emitmail-updater
    restart: unless-stopped
    working_dir: /workspace
    environment:
      UPDATER_SECRET: ${UPDATER_SECRET:-changeme}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "apk add --no-cache bash socat git curl 2>/dev/null || true; chmod +x /workspace/docker/updater-server.sh /workspace/docker/updater-handler.sh /workspace/update.sh 2>/dev/null || true; exec /workspace/docker/updater-server.sh"
    networks:
      - mail_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mail_net:
    driver: bridge
